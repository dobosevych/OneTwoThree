AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - backend on ECS Fargate behind an ALB, PostgreSQL on RDS.
  Free-tier minded: no NAT gateway, db.t4g.micro with 20 GB gp2, DB password in SSM Parameter Store.

Parameters:
  Project:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

  # --- Backend (ECS Fargate) ---
  ImageUri:
    Type: String
    Description: Full backend image URI including tag, e.g. <account>.dkr.ecr.<region>.amazonaws.com/meetings-backend:abc123.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues: [ARM64, X86_64]
    Description: Must match the platform the image was built for. ARM64 (Graviton) is ~20% cheaper.
  TaskCpu:
    Type: String
    Default: "256"
    Description: Fargate CPU units (256 = 0.25 vCPU, the smallest size).
  TaskMemory:
    Type: String
    Default: "512"
    Description: Fargate memory in MiB (512 is the smallest for 0.25 vCPU).
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
  UseFargateSpot:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Fargate has no free tier; Spot is ~70% cheaper but tasks may be interrupted.
  CorsOrigins:
    Type: String
    Default: http://localhost:3000,http://localhost:5173
    Description: Comma-separated browser origins allowed to call the API.
  Seed:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Insert sample participants on first start.
  LogRetentionDays:
    Type: Number
    Default: 7

  # --- Database (RDS PostgreSQL) ---
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: db.t4g.micro and db.t3.micro are free-tier eligible.
  DbEngineVersion:
    Type: String
    Default: "16"
  DbAllocatedStorage:
    Type: Number
    Default: 20
    Description: GB of General Purpose SSD (20 GB is covered by the free tier).
  DbName:
    Type: String
    Default: meetings
  DbUsername:
    Type: String
    Default: meetings
  DbPasswordParameter:
    Type: String
    Default: /meetings/db/password
    Description: SSM SecureString holding the master password (created by `make aws-backend-db-password`).
  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35

  # --- Load balancer ---
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN; when set the ALB serves HTTPS and redirects HTTP to it.

Conditions:
  UseSpot: !Equals [!Ref UseFargateSpot, "true"]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  # =====================================================================
  # Network: public subnets for ALB + tasks, private subnets for RDS.
  # No NAT gateway (not free); tasks get a public IP but only accept ALB traffic.
  # =====================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${Project}-igw" }]

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-public-1" }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Project}-public-2" }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "${Project}-private-1" }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!GetAtt Vpc.CidrBlock, 4, 8]]
      Tags: [{ Key: Name, Value: !Sub "${Project}-private-2" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-public" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Project}-private" }]

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # --- Security groups ---
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP/HTTPS to the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - !If
          - HasCertificate
          - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
          - !Ref AWS::NoValue
      Tags: [{ Key: Name, Value: !Sub "${Project}-alb" }]

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend tasks - traffic only from the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup }
      Tags: [{ Key: Name, Value: !Sub "${Project}-backend" }]

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL - only from backend tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref BackendSecurityGroup }
      Tags: [{ Key: Name, Value: !Sub "${Project}-db" }]

  # =====================================================================
  # Database
  # =====================================================================
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub ${Project} database subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    # A final snapshot is kept when the stack is deleted (free-tier backup storage covers it).
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${Project}-db
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp2
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Sub "{{resolve:ssm-secure:${DbPasswordParameter}}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      DeletionProtection: false

  # =====================================================================
  # Load balancer
  # =====================================================================
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${Project}-alb
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref AlbSecurityGroup]

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${Project}-backend
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /api/health
      Matcher: { HttpCode: "200" }
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }
          - Type: forward
            TargetGroupArn: !Ref BackendTargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # =====================================================================
  # ECS Fargate
  # =====================================================================
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref Project
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      ClusterSettings:
        - { Name: containerInsights, Value: disabled }

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${Project}-backend
      RetentionInDays: !Ref LogRetentionDays

  # Used by the ECS agent: pull the image, write logs, read the DB password.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-password
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbPasswordParameter}

  # Assumed by the application itself; it needs no AWS permissions today.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-backend
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref CpuArchitecture
      ContainerDefinitions:
        - Name: backend
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - { ContainerPort: 8000, Protocol: tcp }
          Environment:
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DB_NAME, Value: !Ref DbName }
            - { Name: DB_USER, Value: !Ref DbUsername }
            - { Name: CORS_ORIGINS, Value: !Ref CorsOrigins }
            - { Name: SEED, Value: !Ref Seed }
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DbPasswordParameter}
          HealthCheck:
            Command:
              - CMD
              - python
              - -c
              - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub ${Project}-backend
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 120
      CapacityProviderStrategy:
        - CapacityProvider: !If [UseSpot, FARGATE_SPOT, FARGATE]
          Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref BackendSecurityGroup]
          AssignPublicIp: ENABLED # no NAT gateway: this is how tasks reach ECR, CloudWatch and SSM
      LoadBalancers:
        - TargetGroupArn: !Ref BackendTargetGroup
          ContainerName: backend
          ContainerPort: 8000
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

Outputs:
  ApiUrl:
    Description: Public URL of the backend API.
    Value: !Sub
      - "${Scheme}://${LoadBalancer.DNSName}/api"
      - Scheme: !If [HasCertificate, https, http]
  ApiDocsUrl:
    Description: Swagger UI of the deployed backend.
    Value: !Sub
      - "${Scheme}://${LoadBalancer.DNSName}/api/docs"
      - Scheme: !If [HasCertificate, https, http]
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt BackendService.Name
  LogGroupName:
    Value: !Ref BackendLogGroup
  DbEndpoint:
    Description: RDS endpoint (reachable only from inside the VPC).
    Value: !GetAtt Database.Endpoint.Address
